server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: cualquier ruta que no sea un fichero real devuelve index.html
    # y React Router decide. Es lo que permite entrar directo a /products o recargar
    # con F5 sin recibir un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend SOLO bajo /api/. No colisiona con ninguna ruta del SPA.
    #
    # Aqui habia tambien `location /products` y `location /categories`, que proxyaban
    # al backend porque la API expone esas rutas sin prefijo (A-1). El efecto era que
    # /products dejaba de ser una ruta del SPA: nginx la mandaba al backend, que
    # respondia 401 sin cuerpo, y el navegador pintaba una pagina en blanco. Entrar
    # directo a /products o pulsar F5 estando en ella daba pantalla vacia.
    #
    # Ademas eran configuracion muerta: el frontend se construye con
    # VITE_API_BASE_URL=http://localhost:8080 horneado en el bundle, asi que llama al
    # backend directo y nunca pasaba por estos proxies. Retiradas.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
